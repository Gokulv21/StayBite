<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>StayBite — Hotel & Restaurant PMS Suite</title>
    <meta name="description" content="Premium hospitality PMS, POS, KDS and contactless guest ordering suite." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StayBite" />
    <meta name="application-name" content="StayBite" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" media="(prefers-color-scheme: light)" href="/icons/staybite-light-48.png" />
    <link rel="icon" type="image/png" sizes="48x48" media="(prefers-color-scheme: dark)" href="/icons/staybite-dark-48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/staybite-light-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/staybite-light-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
    <script>
      // Service Worker Registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ StayBite PWA Service Worker Registered:', reg.scope))
            .catch((err) => console.warn('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
